[project]
name = "colombia-hydrodata"
version = "0.3.0"
description = ""
authors = [
    { name = "Sebástian Narváez Salcedo", email = "sebnarvaez19@outlook.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.1)",
    "requests (>=2.32.5)",
    "aquarius-webportal (>=0.4.1)",
    "shapely (>=2.1.2)",
    "geopandas (>=1.1.3)",
    "platformdirs (>=4.9.4)",
    "pyarrow (>=23.0.1)",
    "statsmodels (>=0.14.6)",
    "seaborn (>=0.13.2)",
]

[tool.poetry]
packages = [{ include = "colombia_hydrodata", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.5.6)",
    "matplotlib (>=3.10.8)",
    "openpyxl (>=3.1.5)",
    "mkdocs-material (>=9.7.6)",
    "mkdocstrings[python] (>=1.0.3)",
    "mkdocs-autorefs (>=1.4.4)",
    "pytest (>=8.0.0)",
]
